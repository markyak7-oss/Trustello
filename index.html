<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustTello Bank — Simulation Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sim-banner">🔐 SIMULATION MODE — For Educational Purposes Only</div>
        <div class="bank-card">
            <h1>TrustTello Bank</h1>
            <p class="tagline">Your demo banking simulation</p>
            <form id="loginForm">
                <div class="input-group">
                    <label>Email address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Any password works" required>
                </div>
                <button type="submit">Login to Simulation</button>
            </form>
            <p class="demo-note">Demo: any email/password works — no data saved</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
